<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{border: 1px solid black;}
    div{ display: inline-block;
        height:50px;
        width:50px;
        }
        p{
            display: none;
        }
    span{
        display: block;
        width: 50px;
    }
    #container{
        width: 100%;
        height: 400px;
    }
    .box{display: inline-block;}
    #box1{
        background-color: greenyellow;
        position:relative;
        top:50px;
    }
    #box2{
        background-color: rgba(255,0,0,1);
        position: fixed;
        z-index: 3;
    }
    #box4{
        position: absolute;
        top:80px;
        left:60px;
    }
</style>
<body>
    <div>Lorem div</div>
    <div>Lorem div</div>
    <p>Lorem p</p>
    <p>Lorem p</p>
    <span>Lorem span</span>
    <span>Lorem span</span>
    <hr>
    <h2>Positions </h2>
    <div id="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>

    </div>

</body>
</html>
