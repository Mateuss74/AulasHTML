<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Contato</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Formulário de Contato</h1>

    <p>
        Preencha os campos abaixo para entrar em contato.
        Os campos obrigatórios precisam ser preenchidos.
    </p>

    <hr>

    <form>

        <!-- NOME -->

        <label for="nome">
            Nome:
        </label>

        <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome"
            required
        >

        <br><br>


        <!-- EMAIL -->

        <label for="email">
            E-mail:
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Digite seu e-mail"
            required
        >

        <br><br>


        <!-- ASSUNTO -->

        <label for="assunto">
            Assunto:
        </label>

        <input
            type="text"
            id="assunto"
            name="assunto"
            placeholder="Digite o assunto"
        >

        <br><br>


        <!-- ESTADO -->

        <label for="estado">
            Estado:
        </label>

        <select
            id="estado"
            name="estado"
        >

            <option value="">
                Selecione seu estado
            </option>

            <option value="SC">
                Santa Catarina
            </option>

            <option value="PR">
                Paraná
            </option>

            <option value="RS">
                Rio Grande do Sul
            </option>

            <option value="SP">
                São Paulo
            </option>

            <option value="RJ">
                Rio de Janeiro
            </option>

        </select>

        <br><br>


        <!-- IDADE -->

        <label for="idade">
            Idade:
        </label>

        <input
            type="number"
            id="idade"
            name="idade"
            placeholder="Digite sua idade"
        >

        <br><br>


        <!-- MENSAGEM -->

        <label for="mensagem">
            Mensagem:
        </label>

        <br>

        <textarea
            id="mensagem"
            name="mensagem"
            placeholder="Digite sua mensagem"
            rows="6"
        ></textarea>

        <br><br>


        <!-- BOTÃO -->

        <button type="submit">
            Enviar
        </button>

        <button type="reset">
            Limpar
        </button>

    </form>

    <br>

    <a href="4_curriculo.html">
        Voltar para o currículo
    </a>

</body>

</html>
