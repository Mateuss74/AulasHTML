<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atividade 4</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: white;

            font-family: Arial, sans-serif;
        }

        .galeria {
            width: 700px;
            height: 260px;

            display: flex;

            gap: 8px;

            align-items: stretch;
        }

        .foto {
            background-size: cover;
            background-position: center;

            border-radius: 24px;

            position: relative;

            overflow: hidden;

            flex-shrink: 0;
        }

        .pequena {
            width: 42px;

            border-radius: 22px;
        }

        .principal {
            flex: 1;

            min-width: 250px;
        }

        .texto {
            position: absolute;

            left: 20px;
            bottom: 15px;

            color: white;

            text-shadow: 0 1px 3px black;
        }

        .texto h2 {
            margin: 0;

            font-size: 18px;
        }

        .texto p {
            margin: 4px 0 0;

            font-size: 12px;
        }

        @media (max-width: 750px) {

            .galeria {
                width: 95%;
            }

        }

        @media (max-width: 600px) {

            .galeria {
                width: 95%;

                height: 500px;

                flex-wrap: wrap;

                justify-content: center;
            }

            .principal {
                order: -1;

                width: 100%;

                height: 260px;

                flex: none;
            }

        }

    </style>

</head>
