<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atividade 2</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: white;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 190px;
            height: 315px;

            border: 2px solid #c000ff;
            border-radius: 5px;

            padding: 22px 16px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            color: #bdbdbd;
            font-size: 11px;

            margin-bottom: 28px;
        }

        .linhas {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 9px;
        }

        .linhas div {
            height: 15px;

            background-color: #e9e9e9;

            border-radius: 3px;
        }

        .perfil {
            margin-top: auto;

            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            background-color: #e3e3e3;
        }

        .nome {
            width: 66px;
            height: 15px;

            border-radius: 2px;

            background-color: #e3e3e3;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="logo">
            Company Logo
        </div>

        <div class="linhas">

            <div></div>
            <div></div>
            <div></div>
            <div></div>

        </div>

        <div class="perfil">

            <div class="avatar"></div>

            <div class="nome"></div>

        </div>

    </div>

</body>

</html>
