<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Barquinho no Mar</title>

    <style>

        /* Remove a margem da página */
        body {
            margin: 0;
            overflow: hidden;
        }


        /*
        CÉU

        O linear-gradient cria o fundo do céu.
        */
        .ceu {
            width: 100%;
            height: 100vh;

            background: linear-gradient(#bdefff, #ffffff);

            position: relative;
        }


        /*
        NUVEM

        A nuvem é feita com uma div.
        border-radius deixa ela arredondada.
        box-shadow cria outras partes da nuvem.
        */
        .nuvem {
            width: 100px;
            height: 35px;

            background-color: white;

            border-radius: 30px;

            box-shadow:
                20px -15px 0 white,
                45px -10px 0 white;

            position: absolute;

            top: 80px;
            left: -120px;

            /*
            Faz a nuvem atravessar o céu.
            */
            animation: moverNuvem 15s linear infinite;
        }


        /*
        ANIMAÇÃO DA NUVEM

        Ela começa fora da tela à esquerda
        e termina fora da tela à direita.
        */
        @keyframes moverNuvem {

            from {
                left: -120px;
            }

            to {
                left: 100%;
            }

        }


        /*
        MAR

        Fica na parte inferior da página.
        */
        .mar {
            width: 100%;
            height: 40%;

            background-color: #4169e1;

            position: absolute;
            bottom: 0;
            left: 0;

            /*
            O barco ficará na frente do mar.
            */
            z-index: 1;
        }


        /*
        PRIMEIRA ONDA

        ::before cria um elemento antes
        do conteúdo da div .mar.

        O radial-gradient cria o formato das ondas.
        */
        .mar::before {
            content: "";

            position: absolute;

            top: -15px;
            left: 0;

            width: 100%;
            height: 30px;

            background:
                radial-gradient(
                    circle,
                    white 10px,
                    transparent 11px
                );

            background-size: 50px 30px;
        }


        /*
        SEGUNDA ONDA

        ::after cria outro elemento para
        deixar o mar mais animado.
        */
        .mar::after {
            content: "";

            position: absolute;

            top: 5px;
            left: 0;

            width: 100%;
            height: 20px;

            background:
                radial-gradient(
                    circle,
                    #87cefa 8px,
                    transparent 9px
                );

            background-size: 60px 20px;
        }


        /*
        BARQUINHO

        A div utiliza uma imagem de fundo.

        Coloque "barco.png" na mesma pasta
        deste arquivo HTML.
        */
        .barco {
            width: 120px;
            height: 80px;

            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQYwZnh9aw65zok-wn6J530Wh7fGO5dv5ThJ15vUimtIA&s=10");

            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;

            position: absolute;

            bottom: 32%;
            left: 0;

            /*
            O z-index deixa o barco na frente
            das ondas do mar.
            */
            z-index: 2;

            /*
            Duas animações:
            - navegar = movimento horizontal
            - balancar = balanço do barco
            */
            animation:
                navegar 10s linear infinite,
                balancar 2s ease-in-out infinite;
        }


        /*
        MOVIMENTO HORIZONTAL DO BARCO

        O barco vai da esquerda para a direita
        e depois começa novamente.
        */
        @keyframes navegar {

            from {
                left: -150px;
            }

            to {
                left: 100%;
            }

        }


        /*
        BALANÇO DO BARCO

        Faz o barco oscilar levemente.
        */
        @keyframes balancar {

            0% {
                transform: rotate(-3deg);
            }

            50% {
                transform: rotate(3deg);
            }

            100% {
                transform: rotate(-3deg);
            }

        }

    </style>
</head>


<body>

    <!-- Céu da animação -->
    <div class="ceu">

        <!-- Nuvem que se movimenta -->
        <div class="nuvem"></div>

        <!-- Mar -->
        <div class="mar"></div>

        <!-- Barquinho -->
        <div class="barco"></div>

    </div>

</body>

</html>
