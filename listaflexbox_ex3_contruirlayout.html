<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atividade 3</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #aaaaaa;

            font-family: Arial, sans-serif;
        }

        .lista {
            width: 320px;

            padding: 8px 14px;

            background-color: white;

            box-shadow: 0 4px 8px #777777;
        }

        .usuario {
            min-height: 70px;

            display: flex;

            align-items: center;

            gap: 14px;

            border-bottom: 1px solid #eeeeee;
        }

        .usuario:last-child {
            border-bottom: none;
        }

        .usuario img {
            width: 48px;
            height: 48px;

            border-radius: 50%;

            object-fit: cover;
        }

        .informacoes {
            display: flex;

            flex-direction: column;

            gap: 4px;
        }

        .informacoes strong {
            color: #666666;

            font-size: 14px;
        }

        .informacoes span {
            color: #aaaaaa;

            font-size: 11px;
        }

    </style>

</head>

<body>

    <div class="lista">

        <div class="usuario">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSPye8eLo55kRwgeFUMNp7OuH7dZZ1obmiMbKgGsECEGw&s=10">

            <div class="informacoes">

                <strong>Cristiano Ronaldo</strong>

                <span>6765 Shady Ln Dr</span>

            </div>

        </div>


        <div class="usuario">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTSupWoh1proQSdEybZU9hOzChPzqcugq36kWAPuK5ThwrQryUkGkhZqkw&s=10">

            <div class="informacoes">

                <strong>Naverdatchi</strong>

                <span>2420 Paddock Way</span>

            </div>

        </div>


        <div class="usuario">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-8b-KlRqAogUupWnRddHQVpOU5nAILDvInG345sKjYg&s=10">

            <div class="informacoes">

                <strong>Dean Sullivan</strong>

                <span>6727 Airplane Ave</span>

            </div>

        </div>


        <div class="usuario">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT0MrZB5vDjMAZARlwPLtUselO_mmfTGkqExvaahFSL_g&s=10">

            <div class="informacoes">

                <strong>Lewis Hamilton</strong>

                <span>6685 Blossom Hill Rd</span>

            </div>

        </div>

    </div>

</body>

</html>
