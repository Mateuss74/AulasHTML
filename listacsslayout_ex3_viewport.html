<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Atividade 3 - Grid</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background-color: white;

            font-family: Arial, sans-serif;
        }

        .grid {

            width: 700px;

            min-height: 500px;

            display: grid;

            grid-template-columns:
                1fr 1fr 1fr 1fr 1fr;

            grid-template-rows:
                80px 1fr 1fr;

            gap: 8px;
        }

        .item {

            background-color: #444;

            color: white;

            border-radius: 4px;

            padding: 15px;

            font-size: 20px;
        }

        .a {

            grid-column: 1 / 3;

            grid-row: 1;
        }

        .b {

            grid-column: 5;

            grid-row: 1;
        }

        .c {

            grid-column: 1;

            grid-row: 2 / 4;
        }

        .bloco-direita {

            grid-column: 2 / 6;

            grid-row: 2 / 4;

            display: grid;

            grid-template-columns:
                1fr 2fr 1fr;

            grid-template-rows:
                1fr 1fr;

            gap: 7px;

            background-color: #444;

            padding: 10px;

            border-radius: 4px;
        }

        .bloco-direita div {

            background-color: #ccc;

            color: #555;

            border-radius: 4px;

            padding: 15px;

            font-size: 22px;
        }

        .e {
            grid-column: 1;
            grid-row: 1;
        }

        .f {
            grid-column: 2;
            grid-row: 1;
        }

        .g {
            grid-column: 3;
            grid-row: 1;
        }

        .m {
            grid-column: 1;
            grid-row: 2;
        }

        .i {
            grid-column: 2;
            grid-row: 2;
        }

        .j {
            grid-column: 3;
            grid-row: 2;
        }

        @media (max-width: 600px) {

            .grid {

                width: 95%;

                grid-template-columns: 1fr 1fr;

            }

            .a {
                grid-column: 1;
            }

            .b {
                grid-column: 2;
            }

            .c {
                grid-column: 1 / 3;
                grid-row: 2;
            }

            .bloco-direita {
                grid-column: 1 / 3;
                grid-row: 3;
            }

        }

    </style>

</head>

<body>

    <main class="grid">

        <div class="item a">
            A
        </div>

        <div class="item b">
            B
        </div>

        <div class="item c">
            C
        </div>

        <div class="bloco-direita">

            <div class="e">
                E
            </div>

            <div class="f">
                F
            </div>

            <div class="g">
                G
            </div>

            <div class="m">
                M
            </div>

            <div class="i">
                I
            </div>

            <div class="j">
                J
            </div>

        </div>

    </main>

</body>

</html>
