<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atividade 6 - Grid</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background-color: white;
        }

        .grid {
            width: 620px;

            height: 300px;

            padding: 5px;

            display: grid;

            grid-template-columns:
                1.2fr 1fr 1.15fr 45px;

            grid-template-rows:
                1fr 1fr 1fr;

            gap: 4px;

            background-color: #eeeeee;
        }

        .bloco {
            border: 3px solid white;
        }

        .laranja {
            grid-column: 1;

            grid-row: 1;

            background-color: #ff9d21;
        }

        .rosa {
            grid-column: 2;

            grid-row: 1 / 3;

            background-color: #f3b5a5;
        }

        .azul {
            grid-column: 3 / 5;

            grid-row: 1;

            background-color: #c9dddd;
        }

        .amarelo {
            grid-column: 1;

            grid-row: 2;

            background-color: #b7c9e3;
        }

        .verde {
            grid-column: 1 / 3;

            grid-row: 3;

            background-color: #f6b32f;
        }

        .bolinhas {
            grid-column: 3 / 5;

            grid-row: 2 / 4;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: space-around;
        }

        .bolinhas span {
            width: 25px;

            height: 25px;

            border-radius: 50%;
        }

        .bolinhas span:nth-child(1) {
            background-color: #ee9362;
        }

        .bolinhas span:nth-child(2) {
            background-color: #d5aaaa;
        }

        .bolinhas span:nth-child(3) {
            background-color: #c5cd94;
        }

        .bolinhas span:nth-child(4) {
            background-color: #cfc1e7;
        }


        /* RESPONSIVIDADE */

        @media (max-width: 600px) {

            .grid {

                width: 90%;

                height: auto;

                display: flex;

                flex-direction: column;

                gap: 8px;

                padding: 8px;
            }

            .bloco {

                width: 100%;

                min-height: 100px;
            }

            .bolinhas {

                width: 100%;

                min-height: 220px;

                display: flex;

                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <main class="grid">

        <div class="bloco laranja"></div>

        <div class="bloco rosa"></div>

        <div class="bloco azul"></div>

        <div class="bloco amarelo"></div>

        <div class="bloco verde"></div>

        <div class="bolinhas">

            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

    </main>

</body>

</html>
