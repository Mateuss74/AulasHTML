<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Estudos Web</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background-color: white;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .pagina {

            width: 800px;

            min-height: 500px;

            display: grid;

            grid-template-columns:
                1fr 1fr 1fr 50px;

            grid-template-rows:
                1fr 1fr 1fr;

            gap: 5px;

            padding: 5px;
        }

        .item {

            padding: 20px;

            color: #555;

            font-size: 20px;

            text-decoration: none;

            display: flex;

            align-items: center;

            justify-content: center;

            transition: 0.3s;
        }

        .item:hover {

            transform: scale(1.02);

            filter: brightness(0.95);
        }

        .web {

            grid-column: 1;

            grid-row: 1;

            background-color: #f99c1c;
        }

        .html {

            grid-column: 2;

            grid-row: 1 / 3;

            background-color: #f3b39f;
        }

        .css {

            grid-column: 3 / 5;

            grid-row: 1;

            background-color: #c7dddd;
        }

        .animate {

            grid-column: 1;

            grid-row: 2;

            background-color: #aec0db;
        }

        .position {

            grid-column: 1 / 3;

            grid-row: 3;

            background-color: #f5b52d;
        }

        .flex {

            grid-column: 3;

            grid-row: 2 / 4;

            background-color: #b9ce68;
        }

        .grid {

            grid-column: 4;

            grid-row: 2 / 4;

            display: flex;

            flex-direction: column;

            gap: 10px;

            justify-content: center;

            align-items: center;
        }

        .bolinha {

            width: 25px;

            height: 25px;

            border-radius: 50%;
        }

        .um {
            background-color: #ed8f5e;
        }

        .dois {
            background-color: #d4a9a9;
        }

        .tres {
            background-color: #c6ce95;
        }

        .quatro {
            background-color: #c9bde4;
        }


        @media screen and (max-width: 600px) {

            .pagina {

                width: 95%;

                display: flex;

                flex-direction: column;

            }

            .item {

                min-height: 100px;

                width: 100%;

            }

            .grid {

                min-height: 180px;

            }

        }

    </style>

</head>

<body>

    <main class="pagina">

        <a href="#" class="item web">
            WEB
        </a>

        <a href="#" class="item html">
            HTML
        </a>

        <a href="#" class="item css">
            CSS
        </a>

        <a href="#" class="item animate">
            Animate
        </a>

        <a href="#" class="item position">
            Position
        </a>

        <a href="#" class="item flex">
            Flex
        </a>

        <div class="grid">

            <a href="#" class="bolinha um"></a>

            <a href="#" class="bolinha dois"></a>

            <a href="#" class="bolinha tres"></a>

            <a href="#" class="bolinha quatro"></a>

        </div>

    </main>

</body>

</html>
